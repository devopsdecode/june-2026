name: Terraform Infrastructure Provisioning (AWS ECS Fargate)

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform Action to perform'
        required: true
        type: choice
        options:
          - apply
          - plan
          - destroy
        default: apply
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/infra.yml'

env:
  AWS_REGION: 'us-east-1'
  TF_WORKING_DIR: './terraform'

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.terraform_action || 'apply' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: ${{ github.event.inputs.terraform_action == 'plan' || github.event_name == 'pull_request' }}
        run: terraform plan -no-color

      - name: Terraform Apply
        if: ${{ (github.event.inputs.terraform_action == 'apply' || github.event_name == 'push') && github.event.inputs.terraform_action != 'destroy' }}
        run: terraform apply -auto-approve -no-color

      - name: Terraform Destroy
        if: ${{ github.event.inputs.terraform_action == 'destroy' }}
        run: terraform destroy -auto-approve -no-color

      - name: Display Infrastructure Outputs
        if: ${{ github.event.inputs.terraform_action != 'destroy' }}
        run: |
          echo "======================================================="
          echo "AWS ECS Fargate Infrastructure Deployed Successfully!"
          terraform output
          echo "======================================================="
